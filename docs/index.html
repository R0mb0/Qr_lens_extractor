<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Lens Extractor</title>
    <!-- Libreria per la lettura del QR Code lato client -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        /* Variabili Tema Chiaro (Base) */
        :root {
            --bg-color: #f4f4f9;
            --surface-color: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #e5e7eb;
            --reset-btn: #f97316; /* Arancione */
            --reset-hover: #ea580c;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }

        /* Variabili Tema Scuro (Manuale basato su classe) */
        body.dark-theme {
            --bg-color: #111827;
            --surface-color: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        /* Stili per la barra dei controlli (Lingua e Tema) */
        .top-controls {
            display: flex;
            justify-content: flex-end; /* Li posiziona in alto a destra */
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .top-controls select, .top-controls button {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            /* Altezza e larghezza fisse per renderli esattamente identici */
            height: 42px;
            width: 90px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            box-sizing: border-box;
            outline: none;
        }

        .top-controls select {
            padding: 0 0.5rem;
        }

        .top-controls button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 1.2rem; /* Rende l'icona della luna proporzionata al box */
        }
        
        .top-controls button:hover, .top-controls select:hover {
            background-color: var(--border-color);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        /* Area di Upload */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .drop-zone.dragover {
            border-color: var(--primary);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .drop-zone input[type="file"] { display: none; }
        .drop-zone p { color: var(--text-muted); font-size: 1.1rem; }

        /* Area Canvas (dove viene disegnato il QR evidenziato) */
        #canvas-container {
            display: none;
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        canvas { width: 100%; height: auto; display: block; }

        /* Risultati e Preview */
        .hidden { display: none !important; }
        
        .result-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-box {
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            transition: background-color 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover { background-color: var(--primary-hover); }

        .btn-reset {
            background-color: var(--reset-btn);
            margin-top: 1rem;
        }
        .btn-reset:hover { background-color: var(--reset-hover); }

        /* Sezione Miniatura */
        .preview-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        
        .preview-img-wrapper {
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        #loading-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Controlli Manuali Lingua e Tema -->
    <div class="top-controls">
        <button id="theme-toggle" title="Toggle Light/Dark Theme">🌓</button>
        <select id="lang-select">
            <option value="en">🇬🇧 EN</option>
            <option value="it">🇮🇹 IT</option>
            <option value="es">🇪🇸 ES</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="de">🇩🇪 DE</option>
            <option value="pt">🇵🇹 PT</option>
        </select>
    </div>

    <h1 id="app-title">QR Code Reader</h1>
    
    <div class="card">
        <!-- Area di Drop -->
        <div id="drop-zone" class="drop-zone">
            <p id="drop-text">Drag & Drop an image here or click</p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- Canvas per mostrare l'immagine e il QR evidenziato -->
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <!-- Sezione Risultato -->
    <div id="result-area" class="card result-section hidden">
        <div id="link-output" class="link-box"></div>
        <div class="button-group">
            <button id="btn-copy-link">Copy Link</button>
            <button id="btn-open-link">Open in New Tab</button>
        </div>

        <!-- Anteprima Pagina Web -->
        <div id="preview-section" class="preview-container hidden">
            <div class="preview-img-wrapper">
                <span id="loading-text">Loading...</span>
                <img id="preview-img" class="hidden" src="" alt="Website Preview" crossorigin="anonymous">
            </div>
            <div class="preview-actions">
                <button id="btn-copy-img">Copy Image</button>
                <button id="btn-down-img">Download</button>
            </div>
        </div>
    </div>

    <!-- Tasto Reset (Arancione) -->
    <button id="btn-reset" class="btn-reset hidden">Start Over</button>
</div>

<script>
    // --- 1. Sistema di Traduzione (i18n) ---
    const dict = {
        en: { title: "QR Lens", drop: "Drag & drop an image here or click", copyLink: "Copy Content", openLink: "Open Link", copyImg: "Copy Image", downImg: "Download Image", reset: "Start Over", loading: "Loading...", noQr: "No QR code found." },
        it: { title: "Lettore QR", drop: "Trascina un'immagine qui o clicca", copyLink: "Copia Contenuto", openLink: "Apri Link", copyImg: "Copia Immagine", downImg: "Scarica Immagine", reset: "Ricomincia", loading: "Caricamento...", noQr: "Nessun QR code trovato." },
        es: { title: "Lector QR", drop: "Arrastra una imagen aquí o haz clic", copyLink: "Copiar Contenido", openLink: "Abrir Enlace", copyImg: "Copiar Imagen", downImg: "Descargar Imagen", reset: "Empezar de Nuevo", loading: "Cargando...", noQr: "No se encontró código QR." },
        fr: { title: "Lecteur QR", drop: "Glissez une image ici ou cliquez", copyLink: "Copier le Contenu", openLink: "Ouvrir le Lien", copyImg: "Copier l'Image", downImg: "Télécharger l'Image", reset: "Recommencer", loading: "Chargement...", noQr: "Aucun code QR trouvé." },
        de: { title: "QR-Leser", drop: "Bild hierher ziehen oder klicken", copyLink: "Inhalt kopieren", openLink: "Link öffnen", copyImg: "Bild kopieren", downImg: "Bild herunterladen", reset: "Neu starten", loading: "Wird geladen...", noQr: "Kein QR-Code gefunden." },
        pt: { title: "Leitor QR", drop: "Arraste uma imagem aqui ou clique", copyLink: "Copiar Conteúdo", openLink: "Abrir Link", copyImg: "Copiar Imagem", downImg: "Baixar Imagem", reset: "Recomeçar", loading: "Carregando...", noQr: "Nenhum código QR encontrado." }
    };

    const langSelect = document.getElementById('lang-select');
    const themeToggle = document.getElementById('theme-toggle');

    // Inizializzazione Lingua (usa preferenza salvata, altrimenti rileva browser)
    let currentLang = localStorage.getItem('qrlens-lang') || (navigator.language || navigator.userLanguage).substring(0, 2);
    if (!dict[currentLang]) currentLang = 'en';
    langSelect.value = currentLang;

    function applyTranslations(lang) {
        const t = dict[lang] || dict['en'];
        document.getElementById('app-title').innerText = t.title;
        document.getElementById('drop-text').innerText = t.drop;
        document.getElementById('btn-copy-link').innerText = t.copyLink;
        document.getElementById('btn-open-link').innerText = t.openLink;
        document.getElementById('btn-copy-img').innerText = t.copyImg;
        document.getElementById('btn-down-img').innerText = t.downImg;
        document.getElementById('btn-reset').innerText = t.reset;
        document.getElementById('loading-text').innerText = t.loading;
        localStorage.setItem('qrlens-lang', lang);
    }
    applyTranslations(currentLang);

    // Cambio lingua manuale
    langSelect.addEventListener('change', (e) => {
        applyTranslations(e.target.value);
    });

    // Inizializzazione Tema (usa preferenza salvata, altrimenti rileva sistema)
    let isDark = localStorage.getItem('qrlens-theme') === 'dark' || 
                 (!localStorage.getItem('qrlens-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) document.body.classList.add('dark-theme');

    // Cambio tema manuale
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
        const darkActive = document.body.classList.contains('dark-theme');
        localStorage.setItem('qrlens-theme', darkActive ? 'dark' : 'light');
    });

    // --- 2. Gestione Elementi DOM ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const canvasContainer = document.getElementById('canvas-container');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const resultArea = document.getElementById('result-area');
    const linkOutput = document.getElementById('link-output');
    const btnOpenLink = document.getElementById('btn-open-link');
    
    const previewSection = document.getElementById('preview-section');
    const previewImg = document.getElementById('preview-img');
    const loadingText = document.getElementById('loading-text');
    const btnReset = document.getElementById('btn-reset');

    let currentUrl = "";
    let currentPreviewBlob = null;

    // --- 3. Eventi Drag & Drop e Upload ---
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processFile(e.target.files[0]);
    });

    // --- 4. Processamento Immagine e Lettura QR ---
    function processFile(file) {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                // Nascondi area drop, mostra canvas
                dropZone.classList.add('hidden');
                canvasContainer.style.display = 'block';
                
                // Imposta canvas e disegna immagine
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Analizza per QR Code
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code) {
                    highlightQR(code.location);
                    showResults(code.data);
                } else {
                    alert(t.noQr);
                    resetApp();
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Effetto Visivo: Evidenzia i bordi del QR Code
    function highlightQR(location) {
        ctx.beginPath();
        ctx.moveTo(location.topLeftCorner.x, location.topLeftCorner.y);
        ctx.lineTo(location.topRightCorner.x, location.topRightCorner.y);
        ctx.lineTo(location.bottomRightCorner.x, location.bottomRightCorner.y);
        ctx.lineTo(location.bottomLeftCorner.x, location.bottomLeftCorner.y);
        ctx.closePath();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#10b981"; // Verde smeraldo
        ctx.stroke();
    }

    // --- 5. Gestione Risultati e API Preview ---
    function showResults(data) {
        currentUrl = data;
        linkOutput.innerText = data;
        resultArea.classList.remove('hidden');
        btnReset.classList.remove('hidden');

        // Controllo se è un URL valido
        if (data.startsWith('http://') || data.startsWith('https://')) {
            btnOpenLink.style.display = 'flex';
            previewSection.classList.remove('hidden');
            loadPreview(data);
        } else {
            // È solo testo, nascondo bottoni specifici per i link
            btnOpenLink.style.display = 'none';
            previewSection.classList.add('hidden');
        }
    }

    async function loadPreview(url) {
        previewImg.classList.add('hidden');
        loadingText.style.display = 'block';
        
        try {
            // API Pubblica Microlink per generare Screenshot del sito (Limitata a uso base gratuito)
            const apiUrl = `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&meta=false`;
            const response = await fetch(apiUrl);
            const json = await response.json();
            
            if (json.status === 'success' && json.data.screenshot) {
                const imgUrl = json.data.screenshot.url;
                
                // Fetch immagine come Blob per aggirare problemi CORS nel salvataggio/copia
                const imgResponse = await fetch(imgUrl);
                currentPreviewBlob = await imgResponse.blob();
                
                const objectUrl = URL.createObjectURL(currentPreviewBlob);
                previewImg.src = objectUrl;
                previewImg.classList.remove('hidden');
                loadingText.style.display = 'none';
            } else {
                throw new Error("Screenshot not available");
            }
        } catch (error) {
            loadingText.innerText = "Preview unavailable";
        }
    }

    // --- 6. Eventi Bottoni (Copia, Apri, Scarica, Reset) ---
    document.getElementById('btn-copy-link').addEventListener('click', () => {
        navigator.clipboard.writeText(currentUrl);
    });

    btnOpenLink.addEventListener('click', () => {
        window.open(currentUrl, '_blank');
    });

    document.getElementById('btn-copy-img').addEventListener('click', async () => {
        if (!currentPreviewBlob) return;
        try {
            const item = new ClipboardItem({ [currentPreviewBlob.type]: currentPreviewBlob });
            await navigator.clipboard.write([item]);
            alert("Image copied to clipboard!");
        } catch (err) {
            alert("Copying images is not supported on this browser.");
        }
    });

    document.getElementById('btn-down-img').addEventListener('click', () => {
        if (!currentPreviewBlob) return;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(currentPreviewBlob);
        link.download = 'qr-preview.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    btnReset.addEventListener('click', resetApp);

    function resetApp() {
        dropZone.classList.remove('hidden');
        canvasContainer.style.display = 'none';
        resultArea.classList.add('hidden');
        previewSection.classList.add('hidden');
        btnReset.classList.add('hidden');
        fileInput.value = "";
        currentPreviewBlob = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>
